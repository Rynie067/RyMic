name: Build Baritone Control UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract project
        run: tar -xzf BaritoneControlUI-source.tar.gz
      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^mod_version=//p' BaritoneControlUI/gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Build mod
        run: gradle -p BaritoneControlUI build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: baritone-control-ui-${{ steps.version.outputs.version }}
          path: BaritoneControlUI/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "BaritoneControlUI/build/libs/baritone-control-ui-${VERSION}.jar" \
            --target "${GITHUB_SHA}" \
            --title "Baritone Control UI ${VERSION}" \
            --prerelease \
            --generate-notes
